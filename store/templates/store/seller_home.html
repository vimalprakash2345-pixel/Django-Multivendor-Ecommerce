<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seller Site - VStore</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logout {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🏪 VStore Seller
        </div>

        <div>
            Hi, {{ user.username }}
            &nbsp;&nbsp;
            <a href="{% url 'logout' %}" class="logout">
                Logout
            </a>
        </div>

    </nav>


    <div class="container">

        <div class="welcome">

            <h1>
                Welcome, {{ user.username }} 👋
            </h1>

            <p>
                This is your Seller Site.
            </p>

        </div>


        <div class="cards">

            <div class="card">
                <h2>📦 Products</h2>

                <p>
                    Manage your products
                </p>

                <a href="{% url 'seller_dashboard' %}">
                    Manage Products
                </a>
            </div>


            <div class="card">
                <h2>➕ Add Product</h2>

                <p>
                    Add a new product
                </p>

                <a href="{% url 'add_product' %}">
                    Add Product
                </a>
            </div>


            <div class="card">
                <h2>📋 Orders</h2>

                <p>
                    View customer orders
                </p>

                <a href="{% url 'seller_orders' %}">
                    View Orders
                </a>
            </div>

        </div>

    </div>

</body>
</html>
