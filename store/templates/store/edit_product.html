<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product - VStore</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        select {
            background: white;
            cursor: pointer;
        }

        .current-image {
            width: 150px;
            height: 150px;
            object-fit: contain;
            display: block;
            margin: 10px 0;
        }

        .save-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🛒 VStore - Seller
        </div>

        <div class="nav-links">
            <a href="{% url 'seller_dashboard' %}">Dashboard</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>

    </nav>


    <div class="container">

        <h1>Edit Product</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}


            <!-- Product Name -->
            <div class="form-group">

                <label>Product Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ product.name }}"
                    required
                >

            </div>


            <!-- Category -->
            <div class="form-group">

                <label>Category</label>

                <select name="category" required>

                    <option value="Electronics"
                        {% if product.category == "Electronics" %}selected{% endif %}>
                        Electronics
                    </option>

                    <option value="Mobiles"
                        {% if product.category == "Mobiles" %}selected{% endif %}>
                        Mobiles
                    </option>

                    <option value="Laptops"
                        {% if product.category == "Laptops" %}selected{% endif %}>
                        Laptops
                    </option>

                    <option value="Clothing"
                        {% if product.category == "Clothing" %}selected{% endif %}>
                        Clothing
                    </option>

                    <option value="Shoes"
                        {% if product.category == "Shoes" %}selected{% endif %}>
                        Shoes
                    </option>

                    <option value="Home & Kitchen"
                        {% if product.category == "Home & Kitchen" %}selected{% endif %}>
                        Home & Kitchen
                    </option>

                    <option value="Beauty"
                        {% if product.category == "Beauty" %}selected{% endif %}>
                        Beauty
                    </option>

                    <option value="Books"
                        {% if product.category == "Books" %}selected{% endif %}>
                        Books
                    </option>

                    <option value="Sports"
                        {% if product.category == "Sports" %}selected{% endif %}>
                        Sports
                    </option>

                    <option value="Other"
                        {% if product.category == "Other" %}selected{% endif %}>
                        Other
                    </option>

                    <option value="General"
                        {% if product.category == "General" %}selected{% endif %}>
                        General
                    </option>

                </select>

            </div>


            <!-- Description -->
            <div class="form-group">

                <label>Description</label>

                <textarea
                    name="description"
                    required
                >{{ product.description }}</textarea>

            </div>


            <!-- Price -->
            <div class="form-group">

                <label>Price</label>

                <input
                    type="number"
                    name="price"
                    value="{{ product.price }}"
                    step="0.01"
                    min="0"
                    required
                >

            </div>


            <!-- Stock -->
            <div class="form-group">

                <label>Stock</label>

                <input
                    type="number"
                    name="stock"
                    value="{{ product.stock }}"
                    min="0"
                    required
                >

            </div>


            <!-- Current Image -->
            <div class="form-group">

                <label>Current Image</label>

                {% if product.image %}

                    <img
                        src="{{ product.image.url }}"
                        class="current-image"
                        alt="{{ product.name }}"
                    >

                {% else %}

                    <p>No image available</p>

                {% endif %}

            </div>


            <!-- Change Image -->
            <div class="form-group">

                <label>Change Image</label>

                <input
                    type="file"
                    name="image"
                    accept="image/*"
                >

            </div>


            <!-- Update -->
            <button
                type="submit"
                class="save-btn"
            >
                Update Product
            </button>

        </form>


        <a
            href="{% url 'seller_dashboard' %}"
            class="back-btn"
        >
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
