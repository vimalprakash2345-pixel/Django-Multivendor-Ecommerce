<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VStore - Checkout</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .checkout-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 25px;
        }

        .checkout-container h1 {
            margin-bottom: 25px;
        }

        .checkout-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .order-summary {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .place-order-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #16a34a;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .place-order-btn:hover {
            background: #15803d;
        }

        .back-btn {
            display: inline-block;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🛒 VStore
        </div>

        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'cart' %}">Cart 🛒</a>
        </div>

    </nav>


    <div class="checkout-container">

        <h1>Checkout</h1>

        <div class="checkout-box">

            <div class="order-summary">

                <h2>Order Summary</h2>

                {% for item in cart_items %}

                    <div class="order-item">

                        <span>
                            {{ item.product.name }}
                            × {{ item.quantity }}
                        </span>

                        <span>
                            ₹{% widthratio item.product.price 1 item.quantity %}
                        </span>

                    </div>

                {% endfor %}

                <div class="total">
                    Total: ₹{{ total }}
                </div>

            </div>


            <h2>Customer Details</h2>

            <br>

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">
                    <label>Full Name</label>
                    <input
                        type="text"
                        name="customer_name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input
                        type="text"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <textarea
                        name="address"
                        placeholder="Enter your complete address"
                        required
                    ></textarea>
                </div>

                <button type="submit" class="place-order-btn">
                    Place Order
                </button>

            </form>

            <a href="{% url 'cart' %}" class="back-btn">
                ← Back to Cart
            </a>

        </div>

    </div>

</body>
</html>
