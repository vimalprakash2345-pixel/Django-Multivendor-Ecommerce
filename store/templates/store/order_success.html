<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .success-container {
            max-width: 600px;
            margin: 100px auto;
            background: white;
            padding: 50px 30px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #16a34a;
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 12px;
            color: #555;
        }

        .order-id {
            font-weight: bold;
            color: #222;
        }

        .amount {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
        }

        .home-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

    <div class="success-container">

        <div class="success-icon">
            ✅
        </div>

        <h1>Order Placed Successfully!</h1>

        <p>Thank you for your order.</p>

        <p class="order-id">
            Order ID: #{{ order.id }}
        </p>

        <div class="amount">
            Total: ₹{{ order.total_amount }}
        </div>

        <p>
            Your order has been received and is being processed.
        </p>

        <a href="{% url 'home' %}" class="home-btn">
            Continue Shopping
        </a>

    </div>

</body>
</html>
